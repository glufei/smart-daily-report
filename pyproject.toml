[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "smart-daily-report"
version = "1.6.1"
description = "Specification-driven team daily report generator"
requires-python = ">=3.11"
dependencies = ["httpx>=0.27,<1", "PyYAML>=6,<7", "Markdown>=3.6,<4", "tzdata>=2024.1"]

[project.scripts]
daily-report = "smart_daily_report.main:main"
daily-report-web = "smart_daily_report.web.main:main"

[project.optional-dependencies]
dev = ["pytest>=8,<9", "pytest-cov>=5,<7"]
web = ["fastapi==0.142.2", "uvicorn==0.54.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--basetemp=.test-tmp --cov=smart_daily_report --cov-report=term-missing --cov-fail-under=90"

[tool.coverage.run]
branch = true
source = ["smart_daily_report"]
