name: CI and delivery

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-and-package:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install Python dependencies
        run: python -m pip install -e '.[dev,web]'

      - name: Test Python with required coverage
        run: python -m pytest -q

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Test frontend with required coverage
        working-directory: frontend
        run: npm run test -- --run --coverage

      - name: Type-check and build frontend
        working-directory: frontend
        run: npm run build

      - name: Build Python wheel
        if: github.event_name != 'pull_request'
        run: python -m pip wheel --no-deps --wheel-dir dist .

      - name: Upload verified build
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: smart-daily-report-${{ github.sha }}
          path: |
            dist/*.whl
            frontend/dist/
          if-no-files-found: error
          retention-days: 14
